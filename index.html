<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanax.music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>Xanax.music</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active" data-target="home-view"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#" data-target="search-view"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#" data-target="library-view"><i class="fa-solid fa-book"></i> Медиатека</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <header>
                <div class="filter-chips">
                    <button class="chip active">Все</button>
                    <button class="chip">Музыка</button>
                    <button class="chip">Подкасты</button>
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-circle"></i>
                </div>
            </header>

            <!-- Вкладка: Главная -->
            <section id="home-view" class="view-section active-view">
                <h2>Недавние</h2>
                <div class="quick-grid" id="historyGrid">
                    <!-- История прослушивания заполняется динамически -->
                </div>

                <div class="playlist-section" style="margin-top: 30px;">
                    <h2>С чего начать</h2>
                    <div class="track-list" id="trackList">
                        <!-- Треки подгружаются из скрипта -->
                    </div>
                </div>
            </section>

            <!-- Вкладка: Поиск (SoundCloud виджет с миллионами треков) -->
            <section id="search-view" class="view-section">
                <div class="playlist-section">
                    <h2>Поиск по каталогу SoundCloud</h2>
                    <p style="color: #b3b3b3; margin-bottom: 20px; font-size: 0.9rem;">Ищи любые треки, ремиксы и исполнителей в реальном времени.</p>
                    
                    <div class="soundcloud-container" style="border-radius: 12px; overflow: hidden; background: #181818; padding: 10px;">
                        <iframe width="100%" height="450" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/133454767&color=%231ed760&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
                    </div>
                </div>
            </section>

            <!-- Вкладка: Медиатека -->
            <section id="library-view" class="view-section">
                <div class="playlist-section">
                    <h2>Ваша медиатека</h2>
                    <p style="color: #b3b3b3; margin-top: 10px;">Здесь будут храниться ваши сохраненные плейлисты.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Нижняя панель плеера -->
    <footer class="player-bar">
        <div class="current-track-info">
            <img id="currentCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300" alt="Cover">
            <div class="track-text">
                <h4 id="currentTitle">Выберите трек</h4>
                <p id="currentArtist">Исполнитель</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="fa-solid fa-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" value="100" max="100">
        </div>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
