<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanax.music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>Xanax.music</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active" data-target="home-view"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#" data-target="search-view"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#" data-target="library-view"><i class="fa-solid fa-heart"></i> Любимые треки</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <header>
                <div class="filter-chips">
                    <button class="chip active">Все</button>
                    <button class="chip">Музыка</button>
                    <button class="chip">Подкасты</button>
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-circle"></i>
                </div>
            </header>

            <!-- Вкладка: Главная -->
            <section id="home-view" class="view-section active-view">
                <h2>Недавние</h2>
                <div class="quick-grid" id="historyGrid"></div>

                <div class="playlist-section" style="margin-top: 30px;">
                    <h2>С чего начать</h2>
                    <div class="track-list" id="trackList"></div>
                </div>
            </section>

            <!-- Вкладка: Поиск и добавление треков -->
            <section id="search-view" class="view-section">
                <div class="playlist-section">
                    <h2>Поиск треков</h2>
                    <div class="search-box-container" style="margin-bottom: 20px;">
                        <input type="text" id="searchInput" placeholder="Что хочешь включить? Начни вводить...">
                    </div>
                    
                    <div class="track-list" id="searchTrackList" style="margin-bottom: 30px;"></div>

                    <!-- Форма добавления трека со SoundCloud -->
                    <div class="add-track-box">
                        <h3><i class="fa-brands fa-soundcloud"></i> Добавить трек со SoundCloud</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="text" id="scTitle" placeholder="Название трека">
                            <input type="text" id="scArtist" placeholder="Исполнитель">
                            <input type="text" id="scUrl" placeholder="Прямая ссылка на аудио (mp3 / stream URL)">
                            <button id="addScTrackBtn">Добавить в Любимые треки</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Вкладка: Любимые треки (Дизайн из примера) -->
            <section id="library-view" class="view-section">
                <div class="playlist-hero">
                    <div class="hero-card-art">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="hero-info">
                        <span class="playlist-tag">Плейлист</span>
                        <h1>Любимые треки</h1>
                        <p id="libraryStats">Forget • 0 треков</p>
                    </div>
                </div>

                <div class="playlist-actions">
                    <button class="big-play-btn" id="playLibraryBtn"><i class="fa-solid fa-play"></i></button>
                    <i class="fa-solid fa-shuffle action-icon"></i>
                    <i class="fa-solid fa-circle-arrow-down action-icon"></i>
                </div>

                <div class="genre-chips">
                    <button class="chip active">Тьма</button>
                    <button class="chip">Быстрая музыка</button>
                    <button class="chip">Грусть</button>
                    <button class="chip">Агрессия</button>
                    <button class="chip">Любовь</button>
                    <button class="chip">Рэп</button>
                    <button class="chip">Соул</button>
                    <button class="chip">Эмо</button>
                </div>

                <!-- Таблица треков в стиле Spotify -->
                <div class="spotify-table">
                    <div class="table-header">
                        <span>#</span>
                        <span>Название</span>
                        <span>Альбом</span>
                        <span>Добавлено</span>
                        <span><i class="fa-regular fa-clock"></i></span>
                    </div>
                    <div id="libraryTableBody" class="table-body">
                        <!-- Треки будут добавляться сюда -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Нижняя панель плеера -->
    <footer class="player-bar">
        <div class="current-track-info">
            <img id="currentCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300" alt="Cover">
            <div class="track-text">
                <h4 id="currentTitle">Выберите трек</h4>
                <p id="currentArtist">Исполнитель</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="fa-solid fa-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" value="100" max="100">
        </div>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
