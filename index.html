<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamWave Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>StreamWave</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#"><i class="fa-solid fa-book"></i> Медиатека</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <header>
                <h1>Добро пожаловать</h1>
                <div class="user-profile">
                    <i class="fa-solid fa-user-circle"></i>
                </div>
            </header>

            <section class="playlist-section">
                <h2>Популярные треки</h2>
                <div class="track-list" id="trackList">
                    <!-- Треки генерируются через JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Нижняя панель плеера -->
    <footer class="player-bar">
        <div class="current-track-info">
            <img id="currentCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300" alt="Cover">
            <div class="track-text">
                <h4 id="currentTitle">Выберите трек</h4>
                <p id="currentArtist">Исполнитель</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="fa-solid fa-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" value="100" max="100">
        </div>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
