<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanax.music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>Xanax.music</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active" data-target="home-view"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#" data-target="search-view"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#" data-target="library-view"><i class="fa-solid fa-book"></i> Медиатека</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <header>
                <div class="filter-chips">
                    <button class="chip active">Все</button>
                    <button class="chip">Музыка</button>
                    <button class="chip">Подкасты</button>
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-user-circle"></i>
                </div>
            </header>

            <!-- Вкладка: Главная -->
            <section id="home-view" class="view-section active-view">
                <h2>Недавние</h2>
                <div class="quick-grid" id="historyGrid"></div>

                <div class="playlist-section" style="margin-top: 30px;">
                    <h2>С чего начать</h2>
                    <div class="track-list" id="trackList"></div>
                </div>
            </section>

            <!-- Вкладка: Поиск и добавление треков -->
            <section id="search-view" class="view-section">
                <div class="playlist-section">
                    <h2>Поиск треков</h2>
                    <div class="search-box-container" style="margin-bottom: 20px;">
                        <input type="text" id="searchInput" placeholder="Что хочешь включить? Начни вводить..." style="width: 100%; max-width: 400px; padding: 12px 16px; border-radius: 20px; border: none; background-color: #242424; color: #ffffff; font-size: 0.95rem; outline: none;">
                    </div>
                    
                    <div class="track-list" id="searchTrackList" style="margin-bottom: 30px;"></div>

                    <!-- Форма добавления трека со SoundCloud -->
                    <div class="add-track-box" style="background: #181818; padding: 20px; border-radius: 12px; max-width: 500px;">
                        <h3 style="margin-bottom: 15px; font-size: 1.1rem;"><i class="fa-brands fa-soundcloud"></i> Добавить трек со SoundCloud</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="text" id="scTitle" placeholder="Название трека" style="padding: 10px; border-radius: 8px; border: none; background: #242424; color: #fff; outline: none;">
                            <input type="text" id="scArtist" placeholder="Исполнитель" style="padding: 10px; border-radius: 8px; border: none; background: #242424; color: #fff; outline: none;">
                            <input type="text" id="scUrl" placeholder="Прямая ссылка на аудио (mp3 / stream URL)" style="padding: 10px; border-radius: 8px; border: none; background: #242424; color: #fff; outline: none;">
                            <button id="addScTrackBtn" style="padding: 10px; border-radius: 8px; border: none; background: #1ed760; color: #000; font-weight: bold; cursor: pointer; margin-top: 5px;">Добавить в медиатеку</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Вкладка: Медиатека -->
            <section id="library-view" class="view-section">
                <div class="playlist-section">
                    <h2>Ваша медиатека</h2>
                    <div class="track-list" id="libraryTrackList" style="margin-top: 15px;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Нижняя панель плеера -->
    <footer class="player-bar">
        <div class="current-track-info">
            <img id="currentCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300" alt="Cover">
            <div class="track-text">
                <h4 id="currentTitle">Выберите трек</h4>
                <p id="currentArtist">Исполнитель</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="fa-solid fa-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" value="100" max="100">
        </div>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
